<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FIKA — Cadete</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f1923;--bg2:#162030;--bg3:#1c2a3d;--border:rgba(201,163,79,0.12);--border2:rgba(201,163,79,0.3);--text:#e8dfc8;--text2:rgba(232,223,200,0.65);--text3:rgba(232,223,200,0.3);--accent:#c9a34f;--ok:#5ab88a;--danger:#e05555}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.logo{font-size:32px;font-weight:600;color:var(--accent);letter-spacing:0.15em;margin-bottom:6px}
.tagline{font-size:10px;color:var(--text3);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:40px}
.f-in{width:100%;background:var(--bg2);border:0.5px solid var(--border2);border-radius:10px;padding:12px 16px;color:var(--text);font-family:'Jost',sans-serif;font-size:15px;outline:none;max-width:320px;display:block;margin-bottom:12px}
.btn-login{width:100%;max-width:320px;padding:14px;background:var(--accent);border:none;border-radius:12px;color:#0f1923;font-family:'Jost',sans-serif;font-size:15px;font-weight:600;cursor:pointer}
#app{display:none}
.header{background:var(--bg2);border-bottom:0.5px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.header-logo{font-size:20px;font-weight:600;color:var(--accent);letter-spacing:0.1em}
.header-sub{font-size:10px;color:var(--text3)}
.container{max-width:500px;margin:0 auto;padding:16px}
.espera{text-align:center;padding:60px 20px;color:var(--text3)}
.espera-icon{font-size:48px;margin-bottom:12px}
.espera-txt{font-size:14px;line-height:1.6}
.pedido-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.pedido-card.entregado{opacity:0.5;border-color:var(--ok)}
.pedido-num{font-size:11px;color:var(--text3);margin-bottom:2px}
.pedido-nombre{font-size:16px;font-weight:600;color:var(--text);margin-bottom:4px}
.pedido-horario{font-size:12px;color:var(--accent);margin-bottom:4px}
.pedido-dom{font-size:12px;color:var(--text2);margin-bottom:12px}
.pedido-panes{font-size:11px;color:var(--text3);margin-bottom:12px;line-height:1.6}
.status-bar{display:flex;gap:8px;margin-bottom:12px}
.btn-status{flex:1;padding:10px;border-radius:10px;border:none;font-family:'Jost',sans-serif;font-size:12px;font-weight:500;cursor:pointer}
.btn-camino{background:rgba(201,163,79,0.15);color:var(--accent);border:0.5px solid var(--border2)}
.btn-camino.active{background:var(--accent);color:#0f1923}
.btn-entregado{background:rgba(90,184,138,0.1);color:var(--ok);border:0.5px solid rgba(90,184,138,0.3)}
.btn-entregado.active{background:var(--ok);color:#0f1923}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.btn-accion{padding:10px 8px;border-radius:10px;border:0.5px solid var(--border2);background:var(--bg3);color:var(--text2);font-family:'Jost',sans-serif;font-size:12px;cursor:pointer;text-align:center}
.btn-accion.wsp{border-color:rgba(37,211,102,0.3);color:#25d366}
.btn-accion.maps{border-color:rgba(66,133,244,0.3);color:#4285f4}
.pago-section{background:var(--bg3);border-radius:10px;padding:12px;margin-bottom:12px}
.pago-title{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px}
.pago-opts{display:flex;gap:8px;margin-bottom:8px}
.pago-opt{flex:1;padding:8px;border-radius:8px;border:0.5px solid var(--border2);background:none;color:var(--text2);font-family:'Jost',sans-serif;font-size:12px;cursor:pointer}
.pago-opt.active{border-color:var(--accent);color:var(--accent);background:rgba(201,163,79,0.08)}
.monto-input{width:100%;background:var(--bg2);border:0.5px solid var(--border2);border-radius:8px;padding:8px 12px;color:var(--text);font-family:'Jost',sans-serif;font-size:14px;outline:none;display:none}
.comentario-input{width:100%;background:var(--bg2);border:0.5px solid var(--border2);border-radius:8px;padding:8px 12px;color:var(--text);font-family:'Jost',sans-serif;font-size:13px;outline:none;resize:none;height:60px;margin-top:8px}
.btn-guardar{width:100%;padding:11px;background:var(--ok);border:none;border-radius:10px;color:#0f1923;font-family:'Jost',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.resumen-bar{background:var(--bg2);border-top:0.5px solid var(--border);padding:12px 16px;position:sticky;bottom:0;display:flex;gap:12px;justify-content:center;font-size:12px;color:var(--text3)}
.res-item{text-align:center}
.res-val{font-size:18px;font-weight:600;color:var(--accent);display:block}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:var(--bg2);border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-width:500px}
.modal-title{font-size:15px;font-weight:600;color:var(--accent);margin-bottom:14px}
.wsp-msg{background:var(--bg3);border-radius:10px;padding:12px;font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:12px}
.btn-enviar-wsp{width:100%;padding:13px;background:#25d366;border:none;border-radius:12px;color:white;font-family:'Jost',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px}
.btn-cerrar-modal{width:100%;padding:11px;background:none;border:0.5px solid var(--border2);border-radius:12px;color:var(--text2);font-family:'Jost',sans-serif;font-size:13px;cursor:pointer}
.tiempo-opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tiempo-opt{padding:8px 14px;border-radius:20px;border:0.5px solid var(--border2);background:none;color:var(--text2);font-family:'Jost',sans-serif;font-size:13px;cursor:pointer}
.tiempo-opt.active{border-color:var(--accent);color:var(--accent);background:rgba(201,163,79,0.08)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="logo">FIKA</div>
  <div class="tagline">Cadete</div>
  <input class="f-in" id="login-user" placeholder="Usuario" autocomplete="off">
  <input class="f-in" id="login-pass" type="password" placeholder="Contraseña">
  <button class="btn-login" onclick="doLogin()">Ingresar</button>
  <div id="login-err" style="color:var(--danger);font-size:12px;margin-top:10px;text-align:center"></div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div>
      <div class="header-logo">FIKA</div>
      <div class="header-sub" id="header-fecha"></div>
    </div>
    <div style="text-align:right">
      <div style="font-size:12px;color:var(--text2)" id="header-user"></div>
      <div style="font-size:10px;color:var(--text3)" id="header-estado"></div>
    </div>
  </div>

  <div class="container">
    <div id="espera-screen" class="espera" style="display:none">
      <div class="espera-icon">⏳</div>
      <div class="espera-txt">El recorrido de hoy aún no fue habilitado.<br>Revisá en unos minutos.</div>
    </div>
    <div id="pedidos-list"></div>
  </div>

  <div class="resumen-bar" id="resumen-bar" style="display:none">
    <div class="res-item"><span class="res-val" id="res-total">0</span>pedidos</div>
    <div class="res-item"><span class="res-val" id="res-entregados">0</span>entregados</div>
    <div class="res-item"><span class="res-val" id="res-efectivo">$0</span>efectivo</div>
  </div>
</div>

<!-- MODAL WHATSAPP -->
<div class="modal-overlay" id="modal-wsp">
  <div class="modal-box">
    <div class="modal-title">Enviar WhatsApp</div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="tiempo-opt active" onclick="selTiempo(this,'en camino')">En camino</button>
      <button class="tiempo-opt" onclick="selTiempo(this,'afuera')">Estoy afuera</button>
    </div>
    <div id="tiempo-section" style="margin-bottom:10px">
      <div style="font-size:11px;color:var(--text3);margin-bottom:6px">Tiempo estimado de llegada:</div>
      <div class="tiempo-opts">
        <button class="tiempo-opt active" onclick="selMin(this,5)">5 min</button>
        <button class="tiempo-opt" onclick="selMin(this,10)">10 min</button>
        <button class="tiempo-opt" onclick="selMin(this,15)">15 min</button>
        <button class="tiempo-opt" onclick="selMin(this,20)">20 min</button>
      </div>
    </div>
    <div class="wsp-msg" id="wsp-preview"></div>
    <button class="btn-enviar-wsp" onclick="enviarWspCadete()">📱 Enviar por WhatsApp</button>
    <button class="btn-cerrar-modal" onclick="cerrarModal()">Cancelar</button>
    <div style="margin-top:12px;padding-top:10px;border-top:0.5px solid var(--border,#333)">
      <div style="font-size:11px;color:var(--text3,#888);margin-bottom:5px">Mensajes enviados (últimas 24hs)</div>
      <div id="wsp-msgs-list" style="display:flex;flex-direction:column;gap:5px;max-height:120px;overflow-y:auto"></div>
    </div>
  </div>
</div>

<script>
var SUPA_URL='https://ovceczfzjloioyjlkert.supabase.co/rest/v1';
var SUPA_KEY='sb_publishable_BMhaLHzbxbmEOiST9Vaw6A_Ufs8PQe7';
var USUARIOS={Jorge01:{pass:'jorge2024',nombre:'Jorge'}};
var usuarioActual=null;
var recorrido=[];
var estados={};
var pagos={};
var wspPedidoActual=null;
var wspTipo='en camino';
var wspMinutos=5;

function sbH(extra){var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};Object.assign(h,extra||{});return h;}
async function sbGet(t,q){try{var r=await fetch(SUPA_URL+'/'+t+'?'+( q||''),{headers:sbH({})});return r.ok?await r.json():null;}catch(e){return null;}}
async function sbInsert(t,d){try{var r=await fetch(SUPA_URL+'/'+t,{method:'POST',headers:sbH({'Prefer':'return=minimal'}),body:JSON.stringify(d)});return r.ok;}catch(e){return false;}}

// ── MENSAJES TEMPORALES (WhatsApp, se borran solos a las 24hs) ──
function registrarMensajeWA(pedidoId,remitente,texto){
  var row={id:'msg_'+Date.now()+'_'+Math.floor(Math.random()*10000),pedido_id:pedidoId,remitente:remitente,texto:texto,hora:new Date().toISOString()};
  sbInsert('mensajes_temp',row);
}
async function renderMensajesTempCadete(pedidoId){
  var wrap=document.getElementById('wsp-msgs-list');
  if(!wrap)return;
  wrap.innerHTML='<div style="font-size:11px;color:#888">Cargando...</div>';
  var cutoff=new Date(Date.now()-24*60*60*1000).toISOString();
  try{await fetch(SUPA_URL+'/mensajes_temp?hora=lt.'+encodeURIComponent(cutoff),{method:'DELETE',headers:sbH()});}catch(e){}
  var data=await sbGet('mensajes_temp','select=*&pedido_id=eq.'+encodeURIComponent(pedidoId)+'&order=hora.asc');
  wrap.innerHTML='';
  if(!data||data.length===0){wrap.innerHTML='<div style="font-size:11px;color:#888">Sin mensajes en las últimas 24hs</div>';return;}
  data.forEach(function(m){
    var row=document.createElement('div');
    row.style.cssText='background:rgba(255,255,255,0.05);border-radius:7px;padding:7px 9px;font-size:12px';
    var hdr=document.createElement('div');
    hdr.style.cssText='display:flex;justify-content:space-between;color:#888;font-size:10px;margin-bottom:2px';
    hdr.textContent=(m.remitente==='cadete'?'Vos':'Admin')+' · '+new Date(m.hora).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    var txt=document.createElement('div');txt.style.color='#ccc';txt.textContent=m.texto;
    row.appendChild(hdr);row.appendChild(txt);wrap.appendChild(row);
  });
}
async function sbPatch(t,q,d){try{var r=await fetch(SUPA_URL+'/'+t+'?'+q,{method:'PATCH',headers:sbH({'Prefer':'return=minimal'}),body:JSON.stringify(d)});return r.ok;}catch(e){return false;}}

function doLogin(){
  var u=document.getElementById('login-user').value.trim();
  var p=document.getElementById('login-pass').value;
  var err=document.getElementById('login-err');
  if(!USUARIOS[u]||USUARIOS[u].pass!==p){err.textContent='Usuario o contraseña incorrectos.';return;}
  usuarioActual={id:u,nombre:USUARIOS[u].nombre};
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('header-user').textContent='Hola, '+usuarioActual.nombre;
  var hoy=new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('header-fecha').textContent=hoy;
  cargarRecorrido();
  setInterval(cargarRecorrido,30000);
}

async function cargarRecorrido(){
  var cfg=await sbGet('config','select=value&key=eq.cadete_recorrido_activo');
  var activo=cfg&&cfg[0]&&cfg[0].value==='true';
  
  if(!activo){
    document.getElementById('espera-screen').style.display='block';
    document.getElementById('pedidos-list').innerHTML='';
    document.getElementById('resumen-bar').style.display='none';
    document.getElementById('header-estado').textContent='Recorrido no habilitado';
    return;
  }
  document.getElementById('espera-screen').style.display='none';
  document.getElementById('header-estado').textContent='Recorrido activo';
  
  var cfgRec=await sbGet('config','select=value&key=eq.cadete_recorrido_ids');
  var ids=[];
  try{ids=JSON.parse(cfgRec&&cfgRec[0]?cfgRec[0].value:'[]');}catch(e){ids=[];}
  
  if(ids.length===0){document.getElementById('pedidos-list').innerHTML='<div class="espera"><div class="espera-icon">📋</div><div class="espera-txt">No hay pedidos en el recorrido.</div></div>';return;}
  
  var rows=await sbGet('pedidos','select=*&id=in.('+ids.join(',')+')');
  if(!rows)return;
  
  // Ordenar por orden del recorrido
  recorrido=ids.map(function(id){return rows.find(function(r){return r.id===id;});}).filter(Boolean);
  renderRecorrido();
}

function renderRecorrido(){
  var lista=document.getElementById('pedidos-list');lista.innerHTML='';
  var totalEfectivo=0;var entregados=0;

  recorrido.forEach(function(p,i){
    var est=p.cadete_status||'pendiente';
    var pago=null;try{pago=p.cadete_pago?JSON.parse(p.cadete_pago):null;}catch(e){}
    if(est==='entregado')entregados++;
    if(pago&&pago.tipo==='efectivo'&&pago.monto)totalEfectivo+=parseInt(pago.monto)||0;

    var card=document.createElement('div');
    card.className='pedido-card'+(est==='entregado'?' entregado':'');
    card.id='card-'+p.id;

    var num=document.createElement('div');num.className='pedido-num';
    num.textContent='Parada '+(i+1)+(p.horario_entrega?' - '+p.horario_entrega:'');card.appendChild(num);
    if(p.horario_desde&&p.horario_hasta){var band=document.createElement('div');band.style.cssText='font-size:11px;color:var(--text3,#888);margin-bottom:2px';band.textContent='Ventana prometida: '+p.horario_desde+' a '+p.horario_hasta;card.appendChild(band);}
    var punt=est==='entregado'?calcPuntualidad(p):null;
    if(punt){var pb=document.createElement('div');pb.style.cssText='display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;color:#0f1923;background:'+punt.color+';margin-bottom:4px';pb.textContent=punt.label;card.appendChild(pb);}
    var nm=document.createElement('div');nm.className='pedido-nombre';nm.textContent=p.nombre;card.appendChild(nm);
    if(p.domicilio){var dom=document.createElement('div');dom.className='pedido-dom';dom.textContent='Direccion: '+p.domicilio+(p.ciudad?', '+p.ciudad:'');card.appendChild(dom);}
    var panes=p.panes?Object.entries(p.panes).filter(function(e){return e[1]>0;}).map(function(e){return e[1]+'x '+e[0];}).join(' - '):'';
    if(panes){var pe=document.createElement('div');pe.className='pedido-panes';pe.textContent=panes;card.appendChild(pe);}

    var sb=document.createElement('div');sb.className='status-bar';
    var bC=document.createElement('button');bC.className='btn-status btn-camino'+(est==='en_camino'?' active':'');bC.textContent='En camino';
    (function(id){bC.onclick=function(){cambiarStatus(id,'en_camino');};})(p.id);
    var bE=document.createElement('button');bE.className='btn-status btn-entregado'+(est==='entregado'?' active':'');bE.textContent='Entregado';
    (function(id){bE.onclick=function(){cambiarStatus(id,'entregado');};})(p.id);
    sb.appendChild(bC);sb.appendChild(bE);card.appendChild(sb);

    var acc=document.createElement('div');acc.className='acciones';
    var bW=document.createElement('button');bW.className='btn-accion wsp';bW.textContent='WhatsApp';
    (function(id){bW.onclick=function(){abrirModalWsp(id);};})(p.id);
    var bM=document.createElement('button');bM.className='btn-accion maps';bM.textContent='Maps';
    var dirEnc=(p.domicilio||'')+', '+(p.ciudad||'Tucuman')+', Argentina';
    (function(d){bM.onclick=function(){abrirMaps(d);};})(dirEnc);
    acc.appendChild(bW);acc.appendChild(bM);card.appendChild(acc);

    var ps=document.createElement('div');ps.className='pago-section';
    var pt=document.createElement('div');pt.className='pago-title';pt.textContent='Cobro';ps.appendChild(pt);
    var po=document.createElement('div');po.className='pago-opts';
    var bT=document.createElement('button');bT.className='pago-opt'+(pago&&pago.tipo==='transferencia'?' active':'');bT.textContent='Transferencia';
    (function(id){bT.onclick=function(){selPago(id,'transferencia');};})(p.id);
    var bEf=document.createElement('button');bEf.className='pago-opt'+(pago&&pago.tipo==='efectivo'?' active':'');bEf.textContent='Efectivo';
    (function(id){bEf.onclick=function(){selPago(id,'efectivo');};})(p.id);
    po.appendChild(bT);po.appendChild(bEf);ps.appendChild(po);
    var mn=document.createElement('input');mn.className='monto-input';mn.id='monto-'+p.id;mn.type='number';mn.placeholder='Monto cobrado';mn.style.display=pago&&pago.tipo==='efectivo'?'block':'none';if(pago&&pago.monto)mn.value=pago.monto;
    (function(id){mn.onchange=function(){guardarPago(id);};})(p.id);ps.appendChild(mn);
    var cm=document.createElement('textarea');cm.className='comentario-input';cm.id='coment-'+p.id;cm.placeholder='Comentario (opcional)';if(pago&&pago.comentario)cm.value=pago.comentario;
    (function(id){cm.onchange=function(){guardarPago(id);};})(p.id);ps.appendChild(cm);card.appendChild(ps);

    var bg=document.createElement('button');bg.className='btn-guardar';bg.textContent='Guardar';
    (function(id){bg.onclick=function(){guardarTodo(id);};})(p.id);card.appendChild(bg);
    lista.appendChild(card);
  });

  document.getElementById('resumen-bar').style.display='flex';
  document.getElementById('res-total').textContent=recorrido.length;
  document.getElementById('res-entregados').textContent=entregados;
  document.getElementById('res-efectivo').textContent='$'+totalEfectivo.toLocaleString('es-AR');
}


async function cambiarStatus(id,status){
  var patch={cadete_status:status};
  if(status==='entregado')patch.hora_entregado=new Date().toISOString();
  await sbPatch('pedidos','id=eq.'+id,patch);
  var p=recorrido.find(function(x){return x.id===id;});
  if(p){p.cadete_status=status;if(patch.hora_entregado)p.hora_entregado=patch.hora_entregado;}
  renderRecorrido();
}

// ── PUNTUALIDAD DE ENTREGA ────────────────────────────────────
function minsHHMM(s){if(!s)return null;var pt=s.split(':');return parseInt(pt[0])*60+parseInt(pt[1]);}
function calcPuntualidad(p){
  if(!p.hora_entregado||!p.horario_desde||!p.horario_hasta)return null;
  var d=new Date(p.hora_entregado);
  var minEnt=d.getHours()*60+d.getMinutes();
  var minDesde=minsHHMM(p.horario_desde),minHasta=minsHHMM(p.horario_hasta);
  if(minDesde==null||minHasta==null)return null;
  if(minEnt<minDesde){
    var diffA=minDesde-minEnt;
    if(diffA>=1)return{color:'#b39ddb',label:'Adelantado ('+diffA+' min)'};
    return{color:'#4caf50',label:'A tiempo'};
  }
  if(minEnt<=minHasta)return{color:'#4caf50',label:'A tiempo'};
  var diffL=minEnt-minHasta;
  if(diffL<=5)return{color:'#ffc107',label:'Demora leve ('+diffL+' min)'};
  return{color:'#f44336',label:'Con demora ('+diffL+' min)'};
}

function selPago(id,tipo){
  var p=recorrido.find(function(x){return x.id===id;});if(!p)return;
  if(!p.cadete_pago)p.cadete_pago=JSON.stringify({});
  var pago=JSON.parse(p.cadete_pago);pago.tipo=tipo;p.cadete_pago=JSON.stringify(pago);
  var monto=document.getElementById('monto-'+id);if(monto)monto.style.display=tipo==='efectivo'?'block':'none';
  var btns=document.querySelectorAll('#card-'+id+' .pago-opt');
  btns.forEach(function(b){b.classList.remove('active');if(b.textContent.toLowerCase().includes(tipo))b.classList.add('active');});
}

async function guardarPago(id){
  var p=recorrido.find(function(x){return x.id===id;});if(!p)return;
  var pago=p.cadete_pago?JSON.parse(p.cadete_pago):{};
  var montoEl=document.getElementById('monto-'+id);if(montoEl&&montoEl.value)pago.monto=montoEl.value;
  var comentEl=document.getElementById('coment-'+id);if(comentEl)pago.comentario=comentEl.value;
  p.cadete_pago=JSON.stringify(pago);
}

async function guardarTodo(id){
  var p=recorrido.find(function(x){return x.id===id;});if(!p)return;
  var pago=p.cadete_pago?JSON.parse(p.cadete_pago):{};
  var montoEl=document.getElementById('monto-'+id);if(montoEl)pago.monto=montoEl.value;
  var comentEl=document.getElementById('coment-'+id);if(comentEl)pago.comentario=comentEl.value;
  await sbPatch('pedidos','id=eq.'+id,{cadete_pago:JSON.stringify(pago),cadete_status:p.cadete_status||'pendiente'});
  var btn=document.querySelector('#card-'+id+' .btn-guardar');
  if(btn){btn.textContent='✓ Guardado';btn.style.background='var(--ok)';setTimeout(function(){btn.textContent='Guardar';btn.style.background='';},2000);}
}

function abrirMaps(dir){
  window.open('https://www.google.com/maps/dir/?api=1&destination='+dir,'_blank');
}

function abrirModalWsp(id){
  wspPedidoActual=id;wspTipo='en camino';wspMinutos=5;
  document.getElementById('tiempo-section').style.display='block';
  actualizarPreviewWsp();
  renderMensajesTempCadete(id);
  document.getElementById('modal-wsp').classList.add('open');
}

function selTiempo(btn,tipo){
  wspTipo=tipo;
  document.querySelectorAll('.modal-box .tiempo-opt').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('tiempo-section').style.display=tipo==='en camino'?'block':'none';
  actualizarPreviewWsp();
}

function selMin(btn,min){
  wspMinutos=min;
  document.querySelectorAll('#tiempo-section .tiempo-opt').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  actualizarPreviewWsp();
}

function actualizarPreviewWsp(){
  var p=recorrido.find(function(x){return x.id===wspPedidoActual;});if(!p)return;
  var nombre=p.nombre.split(' ')[0];
  var msg=wspTipo==='en camino'
    ?'Hola '+nombre+'! Soy Jorge de FIKA, estoy en camino a tu domicilio. Llego en aproximadamente '+wspMinutos+' minutos '+String.fromCodePoint(127838)
    :'Hola '+nombre+'! Soy Jorge de FIKA, estoy afuera de tu domicilio '+String.fromCodePoint(127838);
  document.getElementById('wsp-preview').textContent=msg;
}

function enviarWspCadete(){
  var p=recorrido.find(function(x){return x.id===wspPedidoActual;});if(!p)return;
  var tel=(p.telefono||'').replace(/\D/g,'');
  var msg=document.getElementById('wsp-preview').textContent;
  var url=tel?'https://wa.me/549'+tel+'?text='+encodeURIComponent(msg):'https://wa.me/?text='+encodeURIComponent(msg);
  registrarMensajeWA(p.id,'cadete',msg);
  window.open(url,'_blank');
  cerrarModal();
}

function cerrarModal(){document.getElementById('modal-wsp').classList.remove('open');}
</script>
</body>
</html>
